name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox
      # needs, so the real-Chromium tests hang at startup without this.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          which google-chrome chromium chromium-browser || true
          bun -e 'import {findBrowser} from "./src/server/browser"; console.log("found:", findBrowser())'
          B=$(bun -e 'import {findBrowser} from "./src/server/browser"; console.log(findBrowser())')
          timeout 20 "$B" --headless=new --remote-debugging-port=0 --user-data-dir=/tmp/p1 --no-first-run about:blank 2>&1 | head -40 || true
          ls /tmp/p1 || true
      - run: bun test
