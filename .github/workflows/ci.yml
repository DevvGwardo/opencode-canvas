name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bash .ci-debug/probe.sh
      - run: CANVAS_DEBUG_BROWSER=1 bun test test/browser.test.ts 2>&1 | grep -vE "dbus|NameHasOwner" | tail -60
